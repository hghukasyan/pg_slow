<svg xmlns="http://www.w3.org/2000/svg" width="920" height="280" viewBox="0 0 920 280" role="img" aria-label="How pg_slow ranking and impact scores work">
  <rect width="920" height="280" rx="12" fill="#0d1117" stroke="#30363d"/>
  <text x="36" y="48" fill="#e6edf3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600">How ranking works</text>
  <text x="36" y="78" fill="#8b949e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">ORDER BY total_exec_time DESC · share of eligible query time</text>

  <!-- bars -->
  <text x="36" y="120" fill="#c9d1d9" font-family="ui-monospace, Menlo, monospace" font-size="12">CRITICAL</text>
  <rect x="130" y="106" width="420" height="18" rx="4" fill="#ff7b72"/>
  <text x="560" y="120" fill="#ff7b72" font-family="ui-monospace, Menlo, monospace" font-size="12">e 25%</text>

  <text x="36" y="158" fill="#c9d1d9" font-family="ui-monospace, Menlo, monospace" font-size="12">HIGH</text>
  <rect x="130" y="144" width="220" height="18" rx="4" fill="#d29922"/>
  <text x="360" y="158" fill="#d29922" font-family="ui-monospace, Menlo, monospace" font-size="12">e 10%</text>

  <text x="36" y="196" fill="#c9d1d9" font-family="ui-monospace, Menlo, monospace" font-size="12">MEDIUM</text>
  <rect x="130" y="182" width="110" height="18" rx="4" fill="#58a6ff"/>
  <text x="250" y="196" fill="#58a6ff" font-family="ui-monospace, Menlo, monospace" font-size="12">e 3%</text>

  <text x="36" y="234" fill="#c9d1d9" font-family="ui-monospace, Menlo, monospace" font-size="12">LOW</text>
  <rect x="130" y="220" width="50" height="18" rx="4" fill="#3fb950"/>
  <text x="190" y="234" fill="#3fb950" font-family="ui-monospace, Menlo, monospace" font-size="12">&lt; 3%</text>
</svg>
